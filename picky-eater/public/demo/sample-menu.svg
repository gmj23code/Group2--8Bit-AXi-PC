    <text x="60" y="466" font-size="15" font-style="italic">Tofu, broccoli, peppers, brown rice, soy-ginger sauce</text>
    <text x="60" y="500" font-size="20" font-weight="bold">Shrimp Tacos</text><text x="540" y="500" font-size="20" text-anchor="end">$15</text>
    <text x="60" y="522" font-size="15" font-style="italic">Corn tortillas, grilled shrimp, cabbage slaw, chipotle mayo</text>
    <text x="60" y="556" font-size="20" font-weight="bold">Steak &amp; Eggs</text><text x="540" y="556" font-size="20" text-anchor="end">$19</text>
    <text x="60" y="578" font-size="15" font-style="italic">Sirloin steak, two fried eggs, roasted potatoes</text>
    <text x="60" y="612" font-size="20" font-weight="bold">Margherita Pizza</text><text x="540" y="612" font-size="20" text-anchor="end">$12</text>
    <text x="60" y="634" font-size="15" font-style="italic">Tomato sauce, fresh mozzarella, basil</text>
    <text x="60" y="668" font-size="20" font-weight="bold">Pesto Pasta</text><text x="540" y="668" font-size="20" text-anchor="end">$14</text>
