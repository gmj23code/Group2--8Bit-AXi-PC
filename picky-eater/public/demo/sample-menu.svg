    <text x="60" y="724" font-size="20" font-weight="bold">Classic Cheeseburger &amp; Fries</text><text x="540" y="724" font-size="20" text-anchor="end">$14</text>
    <text x="60" y="746" font-size="15" font-style="italic">Beef patty, cheddar, brioche bun, fries</text>

    <text x="60" y="796" font-size="22" font-weight="bold" letter-spacing="3" fill="#a0522d">SWEETS &amp; SIPS</text>
    <text x="60" y="826" font-size="18" font-weight="bold">Greek Yogurt Parfait $7</text>
